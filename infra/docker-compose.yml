# ============================================================================
#  PROJETO CSI-10 - Banco de dados PostGIS (PostgreSQL + extensao geografica)
#
#  COMO USAR (a partir da pasta "infra", com o Docker Desktop ABERTO):
#     docker compose up -d     -> liga o banco em segundo plano
#     docker compose ps        -> mostra se esta de pe (status "healthy")
#     docker compose logs -f   -> acompanha os logs
#     docker compose down      -> desliga (os dados continuam salvos no volume)
#     docker compose down -v   -> desliga E APAGA os dados (recomeca do zero)
#
#  As credenciais vem do arquivo "infra/.env" (copie de ".env.example").
# ============================================================================
services:
  db:
    image: postgis/postgis:16-3.4      # PostgreSQL 16 ja com PostGIS 3.4 embutido
    container_name: csi10_postgis
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"         # porta_no_seu_PC : porta_dentro_do_container
    volumes:
      - pgdata:/var/lib/postgresql/data            # onde os dados ficam guardados
      - ./initdb:/docker-entrypoint-initdb.d:ro    # SQL rodado na 1a vez que sobe
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  pgdata:                              # "disco virtual" que sobrevive a reinicios
