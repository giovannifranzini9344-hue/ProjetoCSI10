server {
  listen 80;

  # Comprime as respostas (JSON do heatmap/pontos fica ~5-10x menor na rede).
  gzip on;
  gzip_types application/json application/javascript text/css;
  gzip_min_length 512;
  gzip_proxied any;

  # Repassa as chamadas /api para o container da API (servico "api").
  location /api/ {
    proxy_pass http://api:3001;
  }

  # Serve o app React (single-page application).
  location / {
    root /usr/share/nginx/html;
    try_files $uri /index.html;
  }
}
